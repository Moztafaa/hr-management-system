<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Request Leave</h2>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

      <div class="row mb-4">
        <div class="col-md-6">
          <p class="text-muted mb-1" style="color: white !important;">Employee</p>
          <p class="fw-bold">{{ employee?.firstName }} {{ employee?.lastName }}</p>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Leave Type <span class="text-danger">*</span></label>
          <select class="form-control" [(ngModel)]="payload.leaveTypeId" name="leaveTypeId">
            <option [value]="0">-- Select --</option>
            <option *ngFor="let lt of leaveTypes" [value]="lt.id">{{ lt.name }}</option>
          </select>
          <small class="text-muted d-block mt-2" *ngIf="payload.leaveTypeId && getAvailableBalance(payload.leaveTypeId)">
            Available Balance: <strong>{{ getAvailableBalance(payload.leaveTypeId) }} days</strong>
          </small>
        </div>
      </div>

      <div class="row">
        <div class="col-md-3 mb-3">
          <label class="form-label">Start Date <span class="text-danger">*</span></label>
          <input type="date" class="form-control" [(ngModel)]="payload.startDate" name="startDate" (change)="onDateChange()" />
        </div>

        <div class="col-md-3 mb-3">
          <label class="form-label">End Date <span class="text-danger">*</span></label>
          <input type="date" class="form-control" [(ngModel)]="payload.endDate" name="endDate" (change)="onDateChange()" />
        </div>

        <div class="col-md-3 mb-3">
          <label class="form-label">Total Days</label>
          <input type="number" class="form-control" [value]="calculatedDays" disabled />
        </div>
      </div>

      <div class="d-flex justify-content-end mt-4">
        <button class="btn btn-secondary me-2" (click)="cancel()">Cancel</button>
        <button class="btn btn-primary" (click)="submit()" [disabled]="isSubmitting">{{ isSubmitting ? 'Submitting...' : 'Submit' }}</button>
      </div>
    </div>
  </div>
</div>
