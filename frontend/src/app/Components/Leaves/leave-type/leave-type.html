<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Leave Types</h2>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div *ngIf="isLoading" class="p-4 text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>

            <div *ngIf="error" class="alert alert-danger m-3" role="alert">
                {{ error }}
            </div>

            <div *ngIf="!isLoading && !error" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th class="ps-4">Name</th>
                            <th>Description</th>
                            <th>Number of Days</th>
                            <th>Carry Forward Limit</th>
                            <th>Is Paid</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let leave of leaveTypes">
                            <td>{{ leave.id }}</td>
                            <td>{{ leave.name }}</td>
                            <td>{{ leave.description }}</td>
                            <td>{{ leave.maxDays }}</td>
                            <td>{{ leave.carryForwardLimit }}</td>
                            <td>{{ leave.isPaid }}</td>
                            <td>
                                <span class="badge bg-success rounded-pill">Active</span>
                            </td>
                        </tr>
                        <tr *ngIf="leaveTypes.length === 0">
                            <td colspan="6" class="text-center py-5 text-muted">No leaves found</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
