<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Leave Requests</h2>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div *ngIf="isLoading" class="p-4 text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>

            <div *ngIf="error" class="alert alert-danger m-3" role="alert">
                {{ error }}
            </div>

            <div *ngIf="!isLoading && !error" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>LeaveName</th>
                            <th>StartDate</th>
                            <th>EndDate</th>
                            <th>TotalDays</th>
                            <th>ReviewedBy</th>
                            <th>ReviewedAt</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let leave of leaveRequests">
                            <td>{{ leave.leaveTypeName }}</td>
                            <td>{{ leave.startDate }}</td>
                            <td>{{ leave.endDate }}</td>
                            <td>{{ leave.totalDays }}</td>
                            <td>{{ leave.reviewedBy }}</td>
                            <td>{{ leave.reviewedAt }}</td>
                        </tr>
                        <tr *ngIf="leaveRequests.length === 0">
                            <td colspan="6" class="text-center py-5 text-muted">No leaves found</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
