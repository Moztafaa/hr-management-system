<div class="update-image-container">
  <div class="card">
    <div class="card-header">
      <h2>Check In</h2>
      <p class="subtitle">Capture your photo to check in</p>
    </div>

    <div class="card-body">
      <!-- <div class="form-group">
        <label for="employeeId">Employee ID</label>
        <input type="number" id="employeeId" [(ngModel)]="employeeId" class="form-control"
          placeholder="Enter Employee ID" />
      </div> -->

      <div class="camera-section">
        <div class="video-wrapper">
          <video #video autoplay playsinline></video>
          <div class="camera-overlay">
            <span class="camera-icon">📷</span>
          </div>
        </div>

        <button class="btn btn-primary capture-btn" (click)="captureImageAndUpload()">
          <span class="icon">📸</span> Capture & Check In
        </button>
      </div>

      <div class="preview-section" *ngIf="capturedImage">
        <h3>Captured Preview</h3>
        <div class="image-preview">
          <img [src]="capturedImage" alt="Captured Preview" />
        </div>
      </div>
    </div>

    <canvas #canvas style="display:none;"></canvas>
  </div>
</div>
