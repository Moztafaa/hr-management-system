<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Performance Reviews</h2>
    <button class="btn btn-primary" (click)="toggleCreateForm()">
      <i class="eva eva-plus-outline"></i> New Review
    </button>
  </div>

  <div class="card shadow-sm" *ngIf="showCreateForm">
    <div class="card-body">
      <h5 class="mb-3">Create New Performance Review</h5>
      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Employee <span class="text-danger">*</span></label>
          <select class="form-control" [(ngModel)]="createForm.employeeId">
            <option [value]="0">-- Select Employee --</option>
            <option *ngFor="let emp of employees" [value]="emp.id">
              {{ emp.firstName }} {{ emp.lastName }} (ID: {{ emp.id }})
            </option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Review Cycle <span class="text-danger">*</span></label>
          <select class="form-control" [(ngModel)]="createForm.reviewCycleId">
            <option [value]="0">-- Select --</option>
            <option *ngFor="let cycle of cycles" [value]="cycle.id">{{ cycle.name }}</option>
          </select>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <button class="btn btn-secondary" (click)="cancel()">Cancel</button>
        <button class="btn btn-primary" (click)="createReview()">Create Review</button>
      </div>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div *ngIf="isLoading" class="p-4 text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <div *ngIf="error && !showCreateForm" class="alert alert-danger m-3">{{ error }}</div>

      <div *ngIf="!isLoading && !error" class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>Cycle</th>
              <th>Final Rating</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let review of reviews">
              <td><strong>{{ getCycleName(review.reviewCycleId) }}</strong></td>
              <td>{{ review.finalRating ?? '-' }}</td>
              <td>
                <span class="badge" [ngClass]="getStatusClass(review.status)">
                  {{ getStatusBadge(review.status) }}
                </span>
              </td>
              <td>
                <button
                  class="btn btn-sm btn-success"
                  (click)="closeReview(review.id)"
                  [disabled]="review.status === 'Closed'"
                >
                  <i class="eva eva-checkmark-outline"></i> Close
                </button>
              </td>
            </tr>
            <tr *ngIf="reviews.length === 0">
              <td colspan="4" class="text-center py-5 text-muted">No performance reviews found</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
