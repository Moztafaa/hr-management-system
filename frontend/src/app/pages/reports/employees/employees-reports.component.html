<div class="container-fluid py-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Employee Reports</h2>
            <p class="mb-0">Workforce distribution and demographics</p>
        </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading()" class="card">
        <div class="card-body text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3 mb-0">Loading employee metrics...</p>
        </div>
    </div>

    <!-- Error State -->
    <div *ngIf="error()" class="alert alert-danger d-flex align-items-center" role="alert">
        <i class="eva eva-alert-circle-outline me-2 fs-4"></i>
        <div>{{ error() }}</div>
    </div>

    <div *ngIf="!isLoading() && !error()">
        <div class="row g-4">
            <!-- Department Breakdown -->
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header bg-transparent border-bottom py-3">
                        <h5 class="card-title mb-0">Employees by Department</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Department</th>
                                        <th class="text-end">Count</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let item of getDepartmentEntries()">
                                        <td>{{ item.key }}</td>
                                        <td class="text-end fw-medium">{{ item.value }}</td>
                                    </tr>
                                    <tr *ngIf="getDepartmentEntries().length === 0">
                                        <td colspan="2" class="text-center py-4">
                                            <div class="empty-state-icon mb-2">
                                                <i class="eva eva-people-outline"></i>
                                            </div>
                                            <p class="mb-0">No data available</p>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Designation Breakdown -->
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header bg-transparent border-bottom py-3">
                        <h5 class="card-title mb-0">Employees by Designation</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Designation</th>
                                        <th class="text-end">Count</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let item of getDesignationEntries()">
                                        <td>{{ item.key }}</td>
                                        <td class="text-end fw-medium">{{ item.value }}</td>
                                    </tr>
                                    <tr *ngIf="getDesignationEntries().length === 0">
                                        <td colspan="2" class="text-center py-4">
                                            <div class="empty-state-icon mb-2">
                                                <i class="eva eva-briefcase-outline"></i>
                                            </div>
                                            <p class="mb-0">No data available</p>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
